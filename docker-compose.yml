services:

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://db:27017/aulalibera
      JWT_SEGRETO: sviluppo-non-usare-in-produzione
      # senza questa il contenitore gira in UTC e gli orari di apertura sbagliano
      TZ: Europe/Rome
    depends_on:
      - db

  db:
    image: mongo:7
    volumes:
      - datimongo:/data/db

volumes:
  datimongo:
